name: "Monitoramento Automático de Preços"

on:
  push:
    branches: [ main ]
  schedule:
    # Executa todos os dias às 11:00 UTC (08:00 Horário de Brasília)
    - cron: '0 11 * * *'
    # Executa também às 21:00 UTC (18:00 Horário de Brasília)
    - cron: '0 21 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-price-radar:
    # Executa no runner local (IP brasileiro residencial para evitar bloqueios Cloudflare da Pichau)
    runs-on: [self-hosted, windows]
    timeout-minutes: 20

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Preparar ferramentas de cache
        shell: bash
        run: |
          "/c/Program Files/Git/usr/bin/gzip.exe" --version
          echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar Testes do Radar
        run: python -m unittest discover -s tests -v

      - name: Restaurar Histórico de Preços
        uses: actions/cache@v4
        with:
          path: historico_precos.json
          key: price-history-${{ github.run_id }}
          restore-keys: |
            price-history-
          enableCrossOsArchive: true

      - name: Executar Radar de Preços e Disparar E-mail
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
        run: |
          python main.py

      - name: Persistir Histórico de Preços
        if: success()
        uses: actions/cache/save@v4
        with:
          path: historico_precos.json
          key: price-history-${{ github.run_id }}

      - name: Salvar Relatório HTML gerado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-precos
          path: ultimo_relatorio.html
          retention-days: 7
